<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1412">
  <title>Biên tập bản đồ · Võ Lâm Idle</title>
  <link rel="stylesheet" href="fonts/ibm-plex-mono.css?v=20261003-v131">
  <link rel="stylesheet" href="edit_map.css?v=20261004-v3">
</head>
<body>
  <header class="head">
    <div><p class="eyebrow">CÔNG CỤ SOURCE</p><h1>Biên tập vật cản bản đồ</h1></div>
    <a class="back" href="index.html">← Quay lại game</a>
  </header>
  <main>
    <section class="toolbar" aria-label="Công cụ biên tập">
      <label class="map-select">Bản đồ<select id="mapSelect" disabled><option>Đang tải danh sách…</option></select></label>
      <div class="tools" role="group" aria-label="Chế độ vẽ">
        <button id="blockMode" class="tool active" type="button" disabled>＋ Thêm block</button>
        <button id="walkMode" class="tool" type="button" disabled>− Xóa block</button>
      </div>
      <label class="brush-select">Cỡ cọ<select id="brushSize" disabled><option value="1">1 ô</option><option value="3">3 × 3</option><option value="5">5 × 5</option></select></label>
      <label class="grid-toggle"><input id="showGrid" type="checkbox" checked> Lưới</label>
      <button id="undoBtn" class="tool" type="button" disabled title="Hoàn tác (⌘/Ctrl+Z)">↶ Hoàn tác</button>
      <button id="redoBtn" class="tool" type="button" disabled title="Làm lại (⌘/Ctrl+Shift+Z)">↷ Làm lại</button>
      <button id="resetBtn" class="tool" type="button" disabled>Khôi phục bản gốc</button>
      <button id="saveBtn" class="save" type="button" disabled>Lưu vào source + backup</button>
      <div class="zoom-tools" aria-label="Điều khiển thu phóng"><button id="zoomOut" type="button" title="Thu nhỏ">−</button><span id="zoomLabel">100%</span><button id="zoomIn" type="button" title="Phóng to">＋</button><button id="fitMap" type="button">Vừa khung</button></div>
    </section>
    <section class="map-meta">
      <span id="mapTitle">Đang tải bản đồ…</span>
      <span id="mapStats" class="muted"></span>
      <span class="legend"><i class="blocked-key"></i> Chặn di chuyển <i class="isolated-key"></i> Vùng rời</span>
    </section>
    <div id="canvasWrap" class="canvas-wrap">
      <canvas id="mapCanvas" tabindex="0" aria-label="Bản đồ; kéo để chỉnh block, giữ Space rồi kéo để rê"></canvas>
      <div id="loading" class="loading">Đang nạp dữ liệu map…</div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Kéo để thêm hoặc xóa block · cuộn chuột để zoom · giữ Space rồi kéo để rê bản đồ. Lưu sẽ tạo bản backup jmo.js trước khi ghi.</div>
  </main>
  <script src="world.js?v=20261004-map-editor"></script>
  <script src="edit_map.js?v=20261004-v3"></script>
</body>
</html>
